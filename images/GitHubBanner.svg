<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141A"/>
      <stop offset="100%" stop-color="#1A1F26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Multi-Framework Visual Tree -->
  <g stroke="url(#accent)" stroke-width="10" fill="none" transform="translate(200,100)">
    <circle cx="300" cy="60" r="60"/>
    <line x1="300" y1="120" x2="300" y2="260"/>

    <!-- Framework Nodes -->
    <circle cx="100" cy="420" r="55"/>
    <circle cx="300" cy="420" r="55"/>
    <circle cx="500" cy="420" r="55"/>

    <!-- Connections -->
    <line x1="300" y1="260" x2="100" y2="420"/>
    <line x1="300" y1="260" x2="300" y2="420"/>
    <line x1="300" y1="260" x2="500" y2="420"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(850,140)">
    <circle cx="0" cy="0" r="110" stroke="#00E5FF" stroke-width="14" fill="none"/>
    <line x1="80" y1="80" x2="180" y2="180" stroke="#00E5FF" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="50%" y="560" font-family="Segoe UI" font-size="72" fill="#F5F7FA" text-anchor="middle">
    UIInspect.MCP
  </text>

  <!-- Subtitle -->
  <text x="50%" y="610" font-family="Segoe UI" font-size="34" fill="#00E5FF" text-anchor="middle">
    Semantic UI Automation for WPF • WinUI • WinForms • Avalonia • MAUI
  </text>
</svg>
